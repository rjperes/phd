name: Build book (HTML + PDF)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render HTML
        run: quarto render --to html

      - name: Render PDF
        run: quarto render --to pdf

      - name: Collect PDF
        run: |
          set -e
          PDF=$(ls _book/*.pdf | head -n1)
          cp "$PDF" phd-quant-methods.pdf
          ls -la phd-quant-methods.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phd-quant-methods-pdf
          path: phd-quant-methods.pdf

      - name: Upload HTML book as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phd-quant-methods-html
          path: _book/

      - name: Upload Pages artifact (HTML)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Publish PDF to rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: phd-quant-methods.pdf
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
